name: Build ServerEvents

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar
        run: |
          CP=$(ls libs/*.jar | tr '\n' ':')
          mkdir -p out
          javac -encoding UTF-8 -classpath "$CP" -d out $(find src -name '*.java')

      - name: Armar jar (sqlite incluido)
        run: |
          mkdir jarstage
          cd jarstage
          jar xf ../libs/sqlite-jdbc.jar
          rm -rf META-INF/maven
          cp -r ../out/com .
          cp ../resources/plugin.yml ../resources/config.yml .
          jar cf ../ServerEvents-1.4.0.jar .

      - uses: actions/upload-artifact@v4
        with:
          name: ServerEvents
          path: ServerEvents-1.4.0.jar

      - name: Publicar jar en el release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ServerEvents-1.4.0.jar \
            --title "ServerEvents (ultima version)" \
            --notes "Jar compilado automaticamente desde el ultimo commit de main."
