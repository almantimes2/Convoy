      unlocked: "&a&l[AIRDROP] &fEl airdrop ya se puede abrir!"
      locked-interact: "&cEste airdrop se desbloquea en %time%"
      wave: "&4&l[AIRDROP] &fUna oleada de contrabandistas llego a recuperar el cargamento caido!"
