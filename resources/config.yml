    # Spawner de SmartSpawner (mob al azar) dentro del airdrop. Necesita el plugin
    # SmartSpawner instalado; si no esta, esta seccion se ignora sola.
    smart-spawner-drop:
      enabled: true
      chance: 0.1
      min-amount: 1
      max-amount: 1
    # Mientras el cofre este bloqueado (todavia desbloqueandose), cada X minutos aparece una
    # oleada de contrabandistas tratando de recuperar el cargamento caido. Aparecen de a
    # lotes con el mismo aviso de particulas blancas que la escolta armada del convoy (el
    # ritmo del goteo usa convoy.defenders.spawn-batch-size/spawn-batch-interval-seconds,
    # no hay una config separada para esto).
    waves:
      enabled: true
      interval-minutes: 1
      pillagers: 6
      vindicators: 3
      witches: 2
      ravagers: 1
      evokers: 1
      ghasts: 0
      blazes: 0
    messages:
      incoming: "&e&l[AIRDROP] &fUn cargamento de emergencia esta cayendo del cielo!"
