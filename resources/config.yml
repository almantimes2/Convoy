      - material: ENCHANTED_BOOK
        chance: 0.5
        min-amount: 1
        max-amount: 2
        enchantments:
          - "MENDING:1"
      - material: ENCHANTED_BOOK
        chance: 0.5
        min-amount: 1
        max-amount: 2
        enchantments:
          - "SHARPNESS:5"
      - material: MACE
        chance: 0.1
        min-amount: 1
        max-amount: 1
      # Extras (agregados por Claude, ajustalos como quieras):
      - material: TOTEM_OF_UNDYING
        chance: 0.15
        min-amount: 1
        max-amount: 1
      - material: NETHER_STAR
        chance: 0.15
        min-amount: 1
